<!DOCTYPE html>
<html>
<head>
  <title>Aged Care Messaging</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      background-color: #f4f6f8;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    #chat-box {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: scroll;
      padding: 10px;
      background: #fff;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .msg {
      margin: 6px 0;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .sent {
      background: #d1e7dd;
      text-align: right;
      margin-left: auto;
    }

    .received {
      background: #f8d7da;
      text-align: left;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 8px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    #send-btn {
      padding: 10px 20px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    #send-btn:hover {
      background-color: #0056b3;
    }

    .elderly-mode {
    font-size: 20px;
    background-color: #fef9e7;
    color: #000;
}
.elderly-mode nav {
    background-color: #ffeb99;
}
.elderly-mode nav a {
    font-size: 22px;
    color: #000;
}
.elderly-mode h1 {
    font-size: 32px;
}
.elderly-mode p, .elderly-mode li {
    font-size: 20px;
}

  </style>
</head>
<body>

  <!-- Accessibility Options -->
<div id="accessibility-controls" style="padding: 10px; background-color: #f0f0f0; text-align: right;">
  <button onclick="toggleAccessibilityMenu()">Accessibility</button>
  <div id="accessibility-menu" style="display: none; margin-top: 10px;">
      <button onclick="increaseTextSize()">A+</button>
      <button onclick="decreaseTextSize()">A-</button>
      <button onclick="toggleDarkMode()">Dark Mode</button>
      <button onclick="toggleElderlyMode()">Elderly Mode</button>
      <button onclick="resetDefaults()">Set to Default</button>
  </div>
</div>

  <h2>Chat With Us</h2>

  <div id="chat-box"></div>

  <div class="input-group">
    <input type="text" id="message" placeholder="Type your message here" />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const currentUser = "You";

    function loadMessages() {
      fetch("get_messages.php")
        .then(response => response.json())
        .then(data => {
          const chatBox = document.getElementById("chat-box");
          chatBox.innerHTML = "";

          data.forEach(msg => {
            const div = document.createElement("div");
            div.classList.add("msg");
            div.classList.add(msg.sender === currentUser ? "sent" : "received");
            div.innerText = `${msg.sender}: ${msg.message}`;
            chatBox.appendChild(div);
          });

          chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    function sendMessage() {
      const message = document.getElementById("message").value.trim();
      if (!message) return;

      fetch("send_message.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `sender=${encodeURIComponent(currentUser)}&message=${encodeURIComponent(message)}`
      })
      .then(() => {
        document.getElementById("message").value = "";
        loadMessages();
      });
    }

    setInterval(loadMessages, 2000);
    loadMessages();
  </script>
  <script src="accessibility.js"></script>

</body>
</html>
